vr_first_person_uses_world_model 0
hud_draw_fixed_reticle 0

// Queue Source scene construction while the render thread drives the direct
// OpenXR target. Synchronous submission serializes both eyes and is slower.
mat_queue_mode 2

// Desktop keyboard/mouse tutorials are not valid for tracked Quest controls.
// The client also suppresses direct KeyHintText messages, including map-authored
// vehicle prompts which bypass the ordinary hint system.
cl_showhelp 0
cl_hudhint_sound 0

// Keep CPU-side renderable and bone preparation threaded as well.
r_threaded_renderables 1
cl_threaded_bone_setup 1

r_flashlightscissor 0

// Preserve Source's normal world near plane in VR. Smaller values lose too
// much depth precision at HL2 map scale and make close brush surfaces flicker.
vr_projection_znear_min 3.0

// Keep true per-eye geometry. Sharing one color/depth layer cannot represent
// right-eye disocclusions and breaks translucent world surfaces near the camera.
hl2quest_vr_single_pass_opaque 0
hl2quest_vr_depth_reproject 0
hl2quest_vr_multiview_depth_resolve 1
hl2quest_vr_multiview_color_resolve 1
hl2quest_vr_multiview_exact_eye_depth 0
hl2quest_vr_render_diagnostics 0

// Render opaque geometry at full fragment rate. The command-stream reductions
// below now recover enough CPU time to retest native image quality without VRS.
hl2quest_vr_opaque_shading_rate 0

// Reuse only CPU-built conservative BSP visibility/draw data. The world itself
// is still rendered independently into both OpenXR layers with eye-local view
// matrices, color and depth.
hl2quest_vr_union_world_lists 1

// Correct two-eye rendering is CPU/submit-bound on Quest 3. Remove optional
// scene passes rather than reusing an invalid eye image.
r_shadows 0
r_shadowrendertotexture 0
r_flashlightdepthtexture 0
r_drawdetailprops 0
cl_detaildist 0
r_decals 0
mp_decals 0
r_drawmodeldecals 0

// Keep map-authored 3D sky geometry. The stereo renderer already reuses the
// left-eye shadow atlas, so disabling the complete skybox removes city models
// for a much larger visual loss than its remaining command-stream cost.
r_3dsky 1
r_drawropes 0
r_drawflecks 0
cl_ejectbrass 0
mat_disable_bloom 1
mat_reduceparticles 1
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_cheapwaterstart 0
r_cheapwaterend 1

// Keep the stock projective mapping. Clear the reflection target to the map's
// fog colour so uncovered VR texels cannot retain an earlier head pose.
hl2quest_vr_water_reflection_guard_scale 1.0
hl2quest_vr_water_reflection_debug_clear 0
hl2quest_vr_water_reflection_safe_clear 0
hl2quest_vr_water_reflection_black_clear 1
hl2quest_vr_water_reflection_standard_projection 0
// Diagnostic r22: collapse reflection lookup to the exact RT centre and remove
// normal-map displacement. This separates UV/projection faults from an empty or
// incorrectly bound reflection target without changing the capture itself.
hl2quest_vr_water_reflection_debug_center_sample 0
hl2quest_vr_cheapwater_refract_alpha 0
